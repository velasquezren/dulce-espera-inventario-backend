# Configuración del servidor Nginx para el Backend Dulce Espera
server {
    listen 80;
    server_name api.dulceespera.yourdomain.com; # <-- Reemplaza con tu dominio real

    # Redirigir todo el tráfico HTTP a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.dulceespera.yourdomain.com; # <-- Reemplaza con tu dominio real

    # Configuración de Certificados SSL (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/api.dulceespera.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dulceespera.yourdomain.com/privkey.pem;

    # Opciones de seguridad SSL recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Registro de logs
    access_log /var/log/nginx/dulce_espera_access.log;
    error_log /var/log/nginx/dulce_espera_error.log;

    # Proxy inverso a Gunicorn / Uvicorn corriendo localmente en el puerto 8000
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (si en el futuro se llega a necesitar)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Tiempos de espera
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
